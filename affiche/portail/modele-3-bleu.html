<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>DAEWOOD WIFI · modèle 3 (clair et bleu)</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  /* Rendered to one 1080 x 1350 image: the captive portal cannot load anything from the internet. */
  :root { --paper: #F5F1E8; --ink: #0B1020; --blue: #1D3FFF; --coral: #FF4F33; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 540px; height: 675px; }
  body {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 600; background: var(--paper); color: var(--ink);
    position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 24px 24px 0;
  }
  b, .x { font-weight: 800; }

  .bar { display: flex; justify-content: space-between; align-items: center; }
  .brand { font-weight: 800; font-size: 19px; letter-spacing: .06em; color: var(--blue); display: flex; align-items: center; gap: 8px; }
  .brand i { width: 14px; height: 14px; border-radius: 50%; background: var(--blue); display: inline-block; }
  .promo { background: var(--coral); color: #fff; font-weight: 800; font-size: 19px; padding: 5px 14px; border-radius: 999px; }

  .hero { margin-top: 14px; position: relative; }
  .hero .k { font-weight: 800; font-size: 26px; letter-spacing: .02em; }
  .hero .big { font-weight: 800; font-size: 216px; line-height: .82; letter-spacing: -.05em; color: var(--blue); margin-left: -8px; white-space: nowrap; }
  .hero .big small { font-size: 96px; letter-spacing: 0; margin-left: 8px; }
  .hero .line { font-size: 30px; font-weight: 800; margin-top: 12px; }
  .hero .line s { font-weight: 600; font-size: 22px; color: #5b6070; margin-left: 10px; }
  .dot {
    position: absolute; right: -6px; top: 4px; width: 112px; height: 112px; border-radius: 50%;
    background: var(--ink); color: var(--paper); transform: rotate(10deg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
  }
  .dot span { font-weight: 800; font-size: 44px; }
  .dot small { font-weight: 800; font-size: 17px; letter-spacing: .08em; margin-top: 3px; }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; flex: 1; }
  .card { border-radius: 16px; padding: 14px 16px 12px; display: flex; flex-direction: column; }
  .card.a { background: var(--blue); color: #fff; }
  .card.b { background: var(--ink); color: var(--paper); }
  .card .k { font-weight: 800; font-size: 21px; letter-spacing: .02em; }
  .card .m { font-size: 19px; margin-top: 2px; opacity: .92; }
  .card .p { font-weight: 800; font-size: 84px; line-height: .9; letter-spacing: -.03em; margin-top: auto; white-space: nowrap; }
  .card .p small { font-size: 38px; letter-spacing: 0; margin-left: 4px; }

  .foot { margin: 14px 0 0; padding: 0 0 13px; text-align: center; font-size: 18px; line-height: 1.35; }
  .foot b { color: var(--blue); }
</style>
</head>
<body>

<div class="bar">
  <div class="brand"><i></i>DAEWOOD WIFI</div>
  <div class="promo">PROMO −60 %</div>
</div>

<div class="hero">
  <div class="k">GIGA HEURE</div>
  <div class="big">100<small>F</small></div>
  <div class="line">1 heure d'internet <s>250 F</s></div>
  <div class="dot"><span>1 Go</span><small>INCLUS</small></div>
</div>

<div class="cards">
  <div class="card a">
    <div class="k">GIGA JOUR</div><div class="m">1 jour · 3 Go</div>
    <div class="p">350<small>F</small></div>
  </div>
  <div class="card b">
    <div class="k">GIGA 3 JOURS</div><div class="m">3 jours de connexion</div>
    <div class="p">750<small>F</small></div>
  </div>
</div>

<div class="foot"><b>Orange Money · MTN MoMo · Espèces</b><br>WhatsApp 671 12 60 92</div>

</body>
</html>
