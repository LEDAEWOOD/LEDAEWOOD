<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>DAEWOOD WIFI · modèle 1 (noir et orange)</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@700;900&display=swap" rel="stylesheet">
<style>
  /* Rendered to one 1080 x 1350 image: the captive portal cannot load anything from the internet. */
  :root { --ink: #111111; --orange: #FF9500; --cream: #FFF6E5; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 540px; height: 675px; }
  body {
    font-family: "Archivo", sans-serif; background: var(--ink); color: var(--cream);
    position: relative; overflow: hidden; display: flex; flex-direction: column;
  }
  .d { font-family: "Anton", sans-serif; font-weight: 400; text-transform: uppercase; }
  .arcs { position: absolute; right: -140px; top: -140px; width: 360px; height: 360px; }

  .top { padding: 22px 26px 0; position: relative; }
  .brand {
    display: inline-block; background: var(--orange); color: var(--ink);
    font-weight: 900; font-size: 14px; letter-spacing: .16em; padding: 6px 11px; border-radius: 4px;
  }
  h1 { font-size: 78px; line-height: .95; margin-top: 12px; }
  h1 span { color: var(--orange); }
  .sub { font-size: 20px; font-weight: 700; margin-top: 10px; }
  .sub b { color: var(--orange); font-weight: 900; }

  .rows { margin: 16px 26px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .row {
    flex: 1; background: var(--cream); color: var(--ink); border-radius: 10px; padding: 0 18px;
    display: flex; align-items: center; justify-content: space-between; position: relative;
  }
  .row .name { font-size: 31px; line-height: 1.1; }
  .row .meta { font-size: 18px; font-weight: 900; margin-top: 3px; }
  .row .price { font-size: 60px; line-height: 1; white-space: nowrap; }
  .row .price small { font-size: 26px; margin-left: 4px; }
  .row.hot { background: var(--orange); }
  .old { font-size: 22px; font-weight: 900; text-decoration: line-through; }
  .pr { display: flex; align-items: center; gap: 14px; }
  .cut {
    position: absolute; top: -9px; right: 14px; background: var(--ink); color: var(--orange);
    font-weight: 900; font-size: 17px; letter-spacing: .04em; padding: 3px 10px; border-radius: 5px;
    transform: rotate(3deg);
  }

  .foot { background: var(--orange); color: var(--ink); padding: 11px 26px 12px; text-align: center; font-weight: 900; font-size: 18px; line-height: 1.3; }
</style>
</head>
<body>

<svg class="arcs" viewBox="0 0 200 200" aria-hidden="true">
  <g fill="none" stroke="#FF9500" stroke-linecap="round">
    <circle cx="100" cy="100" r="34" stroke-width="9" opacity=".95"/>
    <circle cx="100" cy="100" r="56" stroke-width="9" opacity=".5"/>
    <circle cx="100" cy="100" r="78" stroke-width="9" opacity=".25"/>
  </g>
  <circle cx="100" cy="100" r="13" fill="#FF9500"/>
</svg>

<div class="top">
  <span class="brand">DAEWOOD WIFI</span>
  <h1 class="d">Internet<br><span>rapide</span></h1>
  <p class="sub">Choisissez · Payez · <b>Surfez</b></p>
</div>

<div class="rows">
  <div class="row hot">
    <span class="cut">PROMO −60 %</span>
    <div><div class="name d">Giga Heure</div><div class="meta">1 heure · 1 Go</div></div>
    <div class="pr"><div class="old">250 F</div><div class="price d">100<small>F</small></div></div>
  </div>
  <div class="row">
    <div><div class="name d">Giga Jour</div><div class="meta">1 jour · 3 Go</div></div>
    <div class="price d">350<small>F</small></div>
  </div>
  <div class="row">
    <div><div class="name d">Giga 3 Jours</div><div class="meta">3 jours de connexion</div></div>
    <div class="price d">750<small>F</small></div>
  </div>
</div>

<div class="foot">Orange Money · MTN MoMo · Espèces<br>WhatsApp 671 12 60 92</div>

</body>
</html>
