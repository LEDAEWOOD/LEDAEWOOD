<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>DAEWOOD WIFI · carré 3 (le réseau du marché)</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@700;900&display=swap" rel="stylesheet">
<style>
  /* Rendered to one 1080 x 1080 image: the captive portal cannot load anything from the internet. */
  :root { --orange: #FF9500; --ink: #111111; --cream: #FFF6E5; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 540px; height: 540px; }
  body { font-family: "Archivo", sans-serif; background: var(--orange); color: var(--ink); position: relative; overflow: hidden; }
  .d { font-family: "Anton", sans-serif; font-weight: 400; text-transform: uppercase; }
  svg.art { position: absolute; inset: 0; width: 540px; height: 540px; }

  .top { position: absolute; left: 28px; top: 26px; }
  .brand { display: inline-block; background: var(--ink); color: var(--orange); font-weight: 900; font-size: 13px; letter-spacing: .18em; padding: 5px 10px; border-radius: 4px; }
  h1 { font-size: 62px; line-height: .95; margin-top: 12px; }

  .stamp {
    position: absolute; left: 28px; bottom: 28px; background: var(--ink); color: var(--cream);
    border-radius: 12px; padding: 11px 16px 12px; transform: rotate(-4deg);
  }
  .stamp .k { font-weight: 900; font-size: 13px; letter-spacing: .14em; }
  .stamp .p { font-size: 50px; line-height: 1; color: var(--orange); margin-top: 2px; }
  .stamp .p small { font-size: 24px; margin-left: 3px; }
  .stamp .m { font-weight: 700; font-size: 14px; margin-top: 2px; }
</style>
</head>
<body>

<svg class="art" viewBox="0 0 540 540" aria-hidden="true">
  <!-- waves around the hub -->
  <g fill="none" stroke="#111111">
    <circle cx="300" cy="360" r="78" stroke-opacity=".28" stroke-width="3"/>
    <circle cx="300" cy="360" r="118" stroke-opacity=".17" stroke-width="3"/>
    <circle cx="300" cy="360" r="160" stroke-opacity=".09" stroke-width="3"/>
  </g>

  <!-- links -->
  <g stroke="#111111" stroke-width="3" stroke-linecap="round">
    <path d="M300 360 L82 262"/><path d="M300 360 L470 244"/><path d="M300 360 L500 392"/>
    <path d="M300 360 L408 478"/><path d="M300 360 L182 352"/>
    <path d="M82 262 L182 352" stroke-dasharray="3 8"/><path d="M470 244 L500 392" stroke-dasharray="3 8"/>
    <path d="M500 392 L408 478" stroke-dasharray="3 8"/>
  </g>

  <!-- hub -->
  <circle cx="300" cy="360" r="50" fill="#111111"/>
  <g transform="translate(300 366)" fill="none" stroke="#FFF6E5" stroke-width="5.5" stroke-linecap="round">
    <path d="M-26 -10 a37 37 0 0 1 52 0"/><path d="M-16 0 a23 23 0 0 1 32 0"/>
  </g>
  <circle cx="300" cy="376" r="5" fill="#FFF6E5"/>

  <!-- nodes -->
  <g fill="#FFF6E5" stroke="#111111" stroke-width="3">
    <circle cx="82" cy="262" r="28"/><circle cx="470" cy="244" r="28"/><circle cx="500" cy="392" r="28"/>
    <circle cx="408" cy="478" r="28"/><circle cx="182" cy="352" r="28"/>
  </g>
  <!-- family: two people -->
  <g fill="#111111"><circle cx="74" cy="254" r="6"/><path d="M62 274 a12 11 0 0 1 24 0 z"/>
    <circle cx="92" cy="258" r="5"/><path d="M83 274 a9 9 0 0 1 18 0 z"/></g>
  <!-- friends: chat -->
  <path d="M456 234 h28 a4 4 0 0 1 4 4 v12 a4 4 0 0 1 -4 4 h-15 l-8 7 v-7 h-5 a4 4 0 0 1 -4 -4 v-12 a4 4 0 0 1 4 -4 z" fill="#111111"/>
  <!-- shop: awning -->
  <g fill="#111111"><path d="M484 382 h32 l4 10 h-40 z"/><rect x="486" y="394" width="28" height="13" rx="1"/></g>
  <rect x="496" y="398" width="8" height="9" fill="#FFF6E5"/>
  <!-- world: globe -->
  <g fill="none" stroke="#111111" stroke-width="2.6"><circle cx="408" cy="478" r="14"/><ellipse cx="408" cy="478" rx="6" ry="14"/><path d="M394 478 h28"/></g>
  <!-- customer: person with phone -->
  <g fill="#111111"><circle cx="178" cy="343" r="7"/><path d="M164 366 a14 12 0 0 1 28 0 z"/></g>
  <rect x="190" y="345" width="7" height="12" rx="1.5" fill="#FF9500" stroke="#111111" stroke-width="1.5"/>

  <!-- labels -->
  <g font-family="Archivo" font-weight="900" font-size="12.5" text-anchor="middle">
    <rect x="50" y="296" width="64" height="20" rx="10" fill="#111111"/><text x="82" y="310" fill="#FFF6E5">Famille</text>
    <rect x="446" y="278" width="48" height="20" rx="10" fill="#111111"/><text x="470" y="292" fill="#FFF6E5">Amis</text>
    <rect x="466" y="426" width="68" height="20" rx="10" fill="#111111"/><text x="500" y="440" fill="#FFF6E5">Boutique</text>
    <rect x="368" y="512" width="80" height="20" rx="10" fill="#111111"/><text x="408" y="526" fill="#FFF6E5">Le monde</text>
    <rect x="152" y="386" width="60" height="20" rx="10" fill="#111111"/><text x="182" y="400" fill="#FFF6E5">Clients</text>
  </g>
</svg>

<div class="top">
  <span class="brand">DAEWOOD WIFI</span>
  <h1 class="d">Tout le marché<br>est connecté.</h1>
</div>

<div class="stamp">
  <div class="k">DÈS</div>
  <div class="p d">100<small>F</small></div>
  <div class="m">1 heure · 1 Go</div>
</div>

</body>
</html>
